name: Unit tests

# The same commands the README's receipts name, so CI and a human run one thing. The suite
# is seconds, and the diagram check is what catches a card-graph edit that forgot its
# pictures — both were previously run only when someone remembered. The LLM-gated
# integration tests are a workflow of their own: integration-test.yml.
on:
  push:
    branches: [main]
  pull_request:
  # Actions → "Run workflow" → pick any branch: a refactor branch wants the same suite
  # before it is merged, and that is exactly when a push trigger cannot help.
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

      - name: Build package
        run: uv build

      - name: Upload distributions
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
