[project]
name = "liferay-context-builder"
version = "0.8.0"
description = "Build a local, cited Liferay DXP context library for the liferay-expert Claude Code skill."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10,<3.14"
dependencies = [
    "markdownify>=0.13,<1",
    "beautifulsoup4>=4.12,<5",
]

[project.scripts]
liferay-context-builder = "liferay_docs_scraper.pipeline:main"
liferay-context-builder-community = "liferay_docs_scraper.community:main"
liferay-context-builder-doctor = "liferay_docs_scraper.doctor:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/liferay_docs_scraper"]

[dependency-groups]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
